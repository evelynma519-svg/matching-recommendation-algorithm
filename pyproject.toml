[project]
name = "matchrec"
version = "0.1.0"
description = "Candidate-centric job matching and recommendation: leakage-safe evaluation, hybrid retrieval, and a de-identification pipeline"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["numpy", "sentence-transformers"]
deid = ["spacy>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
